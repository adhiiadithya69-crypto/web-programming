<html>
<head>
    <title>Mouse event</title>
</head>
<body style="text-align:center;">
    <h2>Mouse Handling</h2>
    <img id="img-tag" src="https://i.pinimg.com/236x/b1/47/ab/b147ab4569a845a8fecc95d44ccb629e.jpg" onmouseover="changeImg()" onmouseout="setOld()" width="220px" height="230px" alt="image"/>
    <script>
     function changeImg(){
    document.getElementById("imgtag").src=
     "https://thumbs.dreamstime.com/b/amazing-mix-vivid-fluid-colors-k-wallpaper-captures-future-vision-reflects-driven-technology-creativity-358917172.jpg";
     }
     function setOld()
     {
    document.getElementById("img-tag").src="https://t3.ftcdn.net/jpg/02/79/23/38/360_F_279233837_1hvwTsz7SR17qkHkYAY4JclVgURDSbJJ.jpg";
    }
     </script>
     </body>
</html>
